<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account | MedExplain</title>

<!-- Material & Typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --bg-flow: radial-gradient(circle at top right, rgba(0,0,0,0.05), transparent 60%);
  --glass-bg: rgba(0, 0, 0, 0.88); 
  --glass-border: rgba(255, 255, 255, 0.12);
  --text-white: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --input-fill: rgba(255, 255, 255, 0.07);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }

body {
  min-height: 100vh;
  background-color: #ffffff;
  background-image: var(--bg-flow);
  display: flex;
  flex-direction: column;
  transition: background 0.3s ease;
}

.auth-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.signup-card {
  width: 100%;
  max-width: 440px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 32px;
  padding: 50px 35px;
  box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4);
  color: var(--text-white);
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-area { text-align: center; margin-bottom: 35px; }
.brand-icon { color: #fff; font-size: 42px; margin-bottom: 10px; }
.brand-name { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; margin: 0; }
.subtitle { font-size: 14px; color: var(--text-muted); margin-top: 10px; }

.form-group { margin-bottom: 18px; position: relative; }

.form-control {
  background: var(--input-fill);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 15px 18px;
  color: #fff;
  font-size: 15px;
  transition: all 0.3s ease;
}

.form-control:focus {
  background: rgba(255, 255, 255, 0.12);
  border-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
  color: #fff;
}

.pass-toggle { position: absolute; right: 16px; top: 15px; color: var(--text-muted); cursor: pointer; font-size: 22px; z-index: 10; }

.btn-submit {
  width: 100%;
  padding: 15px;
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  font-size: 16px;
  margin-top: 10px;
  transition: all 0.25s ease;
  cursor: pointer;
}

.btn-submit:hover { background: #f0f0f0; transform: translateY(-2px); }

.alert-custom {
  background: rgba(239, 68, 68, 0.12);
  color: #ff9999;
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: 14px;
  font-size: 13px;
  padding: 14px;
  margin-bottom: 25px;
  text-align: center;
}

.footer-link { margin-top: 30px; text-align: center; font-size: 14px; color: var(--text-muted); }
.footer-link a { color: #fff; text-decoration: none; font-weight: 700; }

.black-footer {
  background: #000000;
  color: #ffffff;
  padding: 25px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}
</style>
</head>

<body>

<div class="auth-wrapper">
  <div class="signup-card">
    <div class="brand-area">
      <span class="material-icons-round brand-icon">health_and_safety</span>
      <h1 class="brand-name">MedExplain</h1>
      <p class="subtitle">Create your secure clinical account</p>
    </div>

    <!-- FLASH MESSAGES -->
    {% if flash %}
      <div class="alert alert-custom">{{ flash }}</div>
    {% endif %}

    <form method="POST" action="/signup">
      <div class="form-group">
        <input type="text" class="form-control" name="fullname" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <input type="email" class="form-control" name="email" placeholder="Email Address" required>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" name="password" id="pass" placeholder="Password" required>
        <span class="material-icons-round pass-toggle" onclick="toggle('pass', this)">visibility</span>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" name="confirm_password" id="conf" placeholder="Confirm Password" required>
        <span class="material-icons-round pass-toggle" onclick="toggle('conf', this)">visibility</span>
      </div>

      <!-- RECAPTCHA REMOVED -->

      <button type="submit" class="btn-submit" id="signupBtn">
        Create Account
      </button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>
</div>

<footer class="black-footer">
  <div>© 2026 MedExplain Intelligence • Educational AI Platform</div>
  <div class="d-none d-md-block">Privacy Policy | Terms of Service</div>
</footer>

<script>
function toggle(id, el) {
  const input = document.getElementById(id);
  const isPass = input.type === "password";
  input.type = isPass ? "text" : "password";
  el.textContent = isPass ? "visibility_off" : "visibility";
}
</script>

</body>
</html>
