<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | MedExplain</title>

<!-- Material & Typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  /* Matching Signup Theme */
  --bg-flow: radial-gradient(circle at top right, rgba(0,0,0,0.05), transparent 60%);
  --glass-bg: rgba(0, 0, 0, 0.88);
  --glass-border: rgba(255, 255, 255, 0.12);
  --text-white: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --input-fill: rgba(255, 255, 255, 0.07);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }

body {
  min-height: 100vh;
  background-color: #ffffff;
  background-image: var(--bg-flow);
  display: flex;
  flex-direction: column;
}

/* ===== MAIN WRAPPER ===== */
.auth-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

/* ===== GLASS CARD ===== */
.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: 32px;
  padding: 50px 35px;
  box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4);
  color: var(--text-white);
  animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== BRANDING ===== */
.brand-area {
  text-align: center;
  margin-bottom: 35px;
}

.brand-icon {
  color: #fff;
  font-size: 42px;
  margin-bottom: 10px;
}

.brand-name {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.8px;
  margin: 0;
}

.subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 10px;
}

/* ===== FORM ELEMENTS ===== */
.form-group {
  margin-bottom: 18px;
  position: relative;
}

.form-control {
  background: var(--input-fill);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 15px 18px;
  color: #fff;
  font-size: 15px;
}

.form-control:focus {
  background: rgba(255, 255, 255, 0.12);
  border-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
  color: #fff;
}

.form-control::placeholder {
  color: rgba(255, 255, 255, 0.3);
}

/* ===== BUTTONS ===== */
.btn-primary-custom {
  width: 100%;
  padding: 15px;
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  font-size: 16px;
  margin-top: 10px;
  transition: all 0.2s ease;
}

.btn-primary-custom:hover {
  background: #f0f0f0;
  transform: translateY(-2px);
}

/* ===== SSO BUTTONS ===== */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 25px 0;
  color: var(--text-muted);
  font-size: 13px;
}

.divider::before, .divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--glass-border);
}

.sso-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.btn-sso {
  background: var(--input-fill);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  transition: 0.2s;
}

.btn-sso:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: #fff;
  color: #fff;
}

.sso-icon { font-size: 20px; }

/* ===== LINKS ===== */
.auth-links {
  margin-top: 30px;
  text-align: center;
  font-size: 14px;
  color: var(--text-muted);
}

.auth-links a {
  color: #fff;
  text-decoration: none;
  font-weight: 700;
}

.auth-links a:hover { text-decoration: underline; }

/* ===== BLACK FOOTER BAR ===== */
.black-footer {
  background: #000000;
  color: #ffffff;
  padding: 25px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.footer-right {
  display: flex;
  gap: 20px;
}

@media (max-width: 600px) {
  .black-footer { flex-direction: column; gap: 15px; text-align: center; }
  .sso-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- FLASH TOAST (Preserved Backend Logic) -->
<div class="toast-container position-fixed top-0 end-0 p-3">
  <div id="flashToast" class="toast text-bg-danger border-0" style="border-radius: 12px;">
    <div class="d-flex p-2">
      <div class="toast-body" id="flashMessage"></div>
      <button type="button" class="btn-close btn-close-white m-auto me-2" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<div class="auth-wrapper">
  <div class="login-card">

    <div class="brand-area">
      <span class="material-icons-round brand-icon">health_and_safety</span>
      <h1 class="brand-name">MedExplain</h1>
      <p class="subtitle">Secure access to clinical AI insights</p>
    </div>

    <!-- FORM -->
    <form method="POST" action="/login">
      <div class="form-group">
        <input type="email" name="email" class="form-control" placeholder="Email Address" required />
      </div>

      <div class="form-group">
        <input type="password" name="password" class="form-control" placeholder="Password" required />
      </div>

      <button type="submit" class="btn-primary-custom">
        Sign In
      </button>
    </form>

    <div class="divider">or continue with</div>

    <!-- SSO GRID -->
    <div class="sso-grid">
      <a href="/auth/google" class="btn-sso">
        <span class="sso-icon">🌐</span>
        Google
      </a>
      <a href="/auth/github" class="btn-sso">
        <span class="material-icons-round sso-icon">code</span>
        GitHub
      </a>
      <a href="/auth/microsoft" class="btn-sso">
        <span class="sso-icon">🪟</span>
        Microsoft
      </a>
    </div>

    <!-- LINKS -->
    <div class="auth-links">
      <div><a href="/forgot-password">Forgot password?</a></div>
      <div class="mt-2">
        New here? <a href="/signup">Create account</a>
      </div>
    </div>

  </div>
</div>

<!-- SOLID BLACK FOOTER -->
<footer class="black-footer">
  <div class="footer-left">
    © 2026 MedExplain Intelligence • Educational Medical AI
  </div>
  <div class="footer-right">
    <span style="color: rgba(255,255,255,0.4)">Privacy</span>
    <span style="color: rgba(255,255,255,0.4)">Terms</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Flash Toast Logic (Preserved)
document.addEventListener("DOMContentLoaded", () => {
  const cookie = document.cookie.split("; ").find(r => r.startsWith("flash="));
  if (cookie) {
    const msg = decodeURIComponent(cookie.split("=")[1]);
    document.getElementById("flashMessage").textContent = msg;
    new bootstrap.Toast(document.getElementById("flashToast")).show();
    document.cookie = "flash=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
  }
});
</script>

</body>
</html>
