{% extends "base.html" %}
{% block title %}Assistant — MediExplain{% endblock %}

{% block content %}
<!-- Markdown Parser for patterned answers -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div class="assistant-integrated-wrapper">
  
  <!-- ===== INTERNAL STATUS HEADER ===== -->
  <div class="assistant-internal-header mb-4">
    <div class="d-flex align-items-center gap-3">
        <div class="clinical-status">
            <span class="pulse-dot"></span>
            <span class="status-label">Clinical Engine Live</span>
        </div>
        <div id="emergencyBanner" class="emergency-pill" style="display:none;">
            ⚠ EMERGENCY PROTOCOL ACTIVE
        </div>
    </div>
    <div class="text-muted tiny-text fw-bold">v2026.01.RAG</div>
  </div>

  <!-- ===== CHAT SCROLL AREA ===== -->
  <div class="chat-viewport" id="scrollContainer">
    <div class="chat-canvas" id="chatBox">
      
      <!-- HERO GREETING (Disappears on first message) -->
      <div id="hero-greeting" class="hero-center">
          <h1 class="fw-900 mb-2">Ready when you are.</h1>
          <p class="text-muted lead">Analyze clinical markers, symptoms, or medical literature.</p>
      </div>

      <div id="conversation-thread" class="conversation-thread"></div>

    </div>
  </div>

  <!-- ===== CENTRIC FLOATING DOCK (ChatGPT Style Spacing) ===== -->
  <div class="chat-input-dock">
    <div class="dock-constraints">
      <div class="input-box-container shadow-sm">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Ask a medical question..."
          oninput="autoResize(this)"
        ></textarea>
        
        <button id="sendBtn" onclick="sendMessage()" class="btn-send-centric">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<style>
/* ===== DIMENSION & FLOW ===== */
.assistant-integrated-wrapper {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 130px); /* Fits perfectly between top-bar and base-footer */
    position: relative;
    width: 100%;
}

.assistant-internal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 10px;
    flex-shrink: 0;
}

.clinical-status { display: flex; align-items: center; gap: 8px; }
.pulse-dot { width: 8px; height: 8px; background: #10a37f; border-radius: 50%; box-shadow: 0 0 8px rgba(16, 163, 127, 0.4); }

.emergency-pill {
    background: #000;
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 20px;
}

/* ===== SCROLLABLE AREA ===== */
.chat-viewport {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 100px; /* Space for the floating dock */
    scrollbar-width: none;
}
.chat-viewport::-webkit-scrollbar { display: none; }

.chat-canvas {
    width: 100%;
    max-width: 1100px; /* Wide view for effective dashboard flow */
    margin: 0 auto;
}

.hero-center {
    text-align: center;
    margin-top: 10vh;
}

.fw-900 { font-weight: 900; letter-spacing: -2.5px; }

/* ===== MESSAGE BUBBLES & PATTERNS ===== */
.conversation-thread { display: flex; flex-direction: column; gap: 40px; }

.msg { animation: slideUp 0.4s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    padding: 12px 20px;
    border-radius: 18px 18px 2px 18px;
    max-width: 80%;
    margin-left: auto;
    border: 1px solid #eee;
    font-size: 15px;
    color: #000;
}

.msg.assistant { width: 100%; }

/* Markdown Formatting */
.markdown-body { font-size: 16.5px; line-height: 1.8; color: #1a1a1a; }
.markdown-body strong { font-weight: 800; color: #000; }
.markdown-body h3 { font-size: 1.2rem; font-weight: 800; margin: 20px 0 10px; border-bottom: 2px solid #000; width: fit-content; padding-bottom: 2px; }
.markdown-body ul { margin: 15px 0; padding-left: 20px; }
.markdown-body li { margin-bottom: 10px; border-left: 3px solid #f0f0f0; padding-left: 12px; list-style: none; }

.disclaimer-tag { margin-top: 15px; font-size: 11px; color: #aaa; font-style: italic; }

/* ===== CENTRIC DOCK (FIXED SPACING) ===== */
.chat-input-dock {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 0; /* Extremely tight padding */
    background: linear-gradient(transparent, #fff 40%);
    display: flex;
    justify-content: center;
    z-index: 100;
}

.dock-constraints { width: 100%; max-width: 800px; }

.input-box-container {
    background: #fff;
    border: 2px solid #000;
    border-radius: 20px;
    padding: 8px 12px;
    display: flex;
    align-items: flex-end;
    transition: box-shadow 0.2s;
}

.input-box-container:focus-within { box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

textarea#messageInput {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    padding: 10px 5px; font-size: 16px; max-height: 150px; color: #000;
}

.btn-send-centric {
    background: #000; color: #fff; border: none; width: 38px; height: 38px;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    transition: 0.2s; margin-left: 8px; margin-bottom: 3px;
}
.btn-send-centric:hover { transform: scale(1.05); }

.thinking { color: #ccc; font-style: italic; font-size: 14px; }
</style>

<script>
function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
}

document.addEventListener("DOMContentLoaded", () => {
    const scrollContainer = document.getElementById("scrollContainer");
    const thread = document.getElementById("conversation-thread");
    const hero = document.getElementById("hero-greeting");
    const input = document.getElementById("messageInput");

    function scrollToBottom() {
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        hero.style.display = "none";
        
        // 1. User Message
        const userDiv = document.createElement("div");
        userDiv.className = "msg user shadow-sm";
        userDiv.innerText = text;
        thread.appendChild(userDiv);
        
        input.value = "";
        input.style.height = 'auto';
        scrollToBottom();

        // 2. Assistant Stream Placeholder
        const assistantDiv = document.createElement("div");
        assistantDiv.className = "msg assistant";
        assistantDiv.innerHTML = `
            <div class="content markdown-body thinking">Synthesizing clinical knowledge...</div>
            <div class="disclaimer-tag">MediExplain Intelligence · RAG Patterns Active</div>
        `;
        thread.appendChild(assistantDiv);
        const contentArea = assistantDiv.querySelector(".content");
        scrollToBottom();

        try {
            const response = await fetch("/api/assistant/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullText = "";
            contentArea.classList.remove("thinking");

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split("\n");

                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        try {
                            const data = JSON.parse(line.replace("data: ", ""));
                            if (data.token) {
                                fullText += data.token;
                                // Patterned Rendering with marked.js
                                contentArea.innerHTML = marked.parse(fullText);
                                scrollToBottom();
                            }
                        } catch (e) { }
                    }
                }
            }
        } catch (err) {
            contentArea.innerHTML = "Connectivity error. Unable to reach AI Engine.";
        }
    }

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
});
</script>
{% endblock %}
