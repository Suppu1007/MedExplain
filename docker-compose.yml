services:

  # =========================
  # OLLAMA LLM SERVICE
  # =========================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # =========================
  # QDRANT VECTOR DATABASE (For Medical RAG)
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # =========================
  # FASTAPI APPLICATION
  # =========================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: app
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - QDRANT_URL=http://qdrant:6333  # <--- Essential for rag_service.py
    ports:
      - "8009:8009"
    depends_on:
      - ollama
      - qdrant  # <--- Ensures Qdrant starts before the app
    volumes:
      - ./app/data:/app/data
      - ./medical_library:/app/medical_library # <--- Mounts your PDF folder
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8009

volumes:
  ollama_data:
  qdrant_data: # <--- Keeps your indexed textbooks safe on disk