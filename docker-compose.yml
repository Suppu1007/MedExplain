services:
  # OLLAMA LLM SERVICE
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # =========================
  # QDRANT VECTOR DATABASE
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # =========================
  # FASTAPI APPLICATION
  # =========================
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medexplain_app
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "1007:1007"
    depends_on:
      - ollama
      - qdrant

    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - ./ml:/ml
      - ./medical_library:/medical_library
    restart: unless-stopped
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 1007
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  ollama_data:
  qdrant_data:
